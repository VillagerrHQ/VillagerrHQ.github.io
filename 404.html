      p { max-width: 430px; margin: 0 auto; color: var(--muted); font-size: 17px; line-height: 1.75; text-wrap: pretty; }
      .home { display: inline-flex; align-items: center; justify-content: center; gap: 20px; min-height: 52px; margin-top: 34px; padding: 14px 24px; border: 1px solid var(--mint); border-radius: 7px; background: var(--mint); color: var(--ink); font-size: 14px; font-weight: 700; text-decoration: none; transition: background .2s, transform .2s; }
      .home:hover { background: #d1e3bf; transform: translateY(-2px); }
      footer { display: flex; justify-content: space-between; gap: 24px; padding-block: 25px; border-top: 1px solid #d8e5d51a; color: var(--muted); font-size: 12px; line-height: 1.5; }
